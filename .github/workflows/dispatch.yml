name: dispatch-checkin

# 用公开库（Actions 分钟数免费）的定时，去触发私有库 fzu-auto-checkin 的 workflow_dispatch
on:
  schedule:
    - cron: '35 13 * * *'   # UTC 13:35 = 北京 21:35
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private checkin workflow
        env:
          TOKEN: ${{ secrets.CHECKIN_DISPATCH_TOKEN }}
        run: |
          set -e
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/fzuleo/fzu-auto-checkin/actions/workflows/checkin.yml/dispatches \
            -d '{"ref":"main"}')
          echo "dispatch http=$code"
          test "$code" = "204"

      - uses: actions/checkout@v4
      - name: Keep-alive commit
        run: |
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          date -u > .keepalive
          git add .keepalive
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
